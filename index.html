<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>健康永續講者</title>



<style>

:root {

  --bg:#15803d;

  --white:#fff;

  --dark:#222;

  --gray:#666;

  --shadow:0 8px 30px rgba(0,0,0,.28);

}



* {

  box-sizing:border-box;

  margin:0;

  padding:0;

}



body {

  background:var(--bg);

  color:#fff;

  font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;

  font-size:16px;

  font-weight:700;

  line-height:1.5;

  -webkit-text-size-adjust:100%;

}



body.modal-open {

  overflow:hidden;

}



.section {

  max-width:1500px;

  margin:auto;

  padding:0 20px 40px;

}



.speaker-group {

  margin-top:42px;

}



.speaker-group:first-child {

  margin-top:0;

}



/* 講者分類標題 */

.group-title {

  display:flex;

  align-items:center;

  justify-content:center;

  gap:12px;

  margin:18px 0 6px;

  font-size:clamp(24px,3vw,34px);

  font-weight:900;

}



.group-title:before,

.group-title:after {

  content:"";

  width:44px;

  height:2px;

  background:rgba(255,255,255,.55);

  border-radius:20px;

}



/* 新增：排列順序說明 */

.sort-note {

  margin:0 0 24px;

  color:rgba(255,255,255,.85);

  font-size:16px;

  font-weight:400;

  text-align:center;

  letter-spacing:1px;

}



.speaker-group:not(.has-sort-note) .group-title { margin-bottom:24px; }

/* 講者列表 */

.grid {

  display:grid;

  gap:20px;

  grid-template-columns:repeat(auto-fit,250px);

  justify-content:center;

}



.speakers_item {

  width:250px;

  max-width:100%;

  justify-self:center;

  padding:16px;

  border:0;

  background:none;

  color:#fff;

  text-align:center;

  border-radius:14px;

  font:inherit;

}



button.speakers_item {

  cursor:pointer;

}



.pic {

  width:200px;

  height:200px;

  margin:0 auto 12px;

  border-radius:50%;

  overflow:hidden;

  background:#fff;

  border:5px solid #fff;

  transition:transform .25s ease;

}



.pic img {

  width:100%;

  height:100%;

  display:block;

  object-fit:cover;

}



.speakers_item.no-photo {

  padding-top:36px;

}



.speakers_item h3 {

  margin-bottom:8px;

  font-size:21px;

  font-weight:800;

}



.speakers_item h4 {

  font-size:16px;

  line-height:1.5;

  font-weight:700;

  opacity:.92;

}



button.speakers_item:focus-visible {

  outline:3px solid #fff;

  outline-offset:2px;

}



@media(hover:hover) and (pointer:fine) {

  button.speakers_item:hover .pic {

    transform:scale(1.08);

  }

}



/* 載入錯誤提示 */

.message {

  margin:28px auto;

  padding:16px;

  max-width:720px;

  text-align:center;

  border:1px solid rgba(255,255,255,.5);

  border-radius:12px;

}



.message button {

  margin-left:8px;

  padding:7px 12px;

  border:0;

  border-radius:999px;

  color:var(--bg);

  font-size:16px;

  font-weight:800;

  cursor:pointer;

}



/* 講者介紹彈窗 */

.modal {

  position:fixed;

  inset:0;

  z-index:99999;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

}



.modal[aria-hidden="false"] {

  display:flex;

}



.overlay {

  position:absolute;

  inset:0;

  background:rgba(0,0,0,.6);

}



.modal-content {

  position:relative;

  z-index:1;

  width:min(520px,92vw);

  max-height:88vh;

  overflow:auto;

  padding:24px;

  background:rgba(255,255,255,.98);

  color:var(--dark);

  border-radius:16px;

  box-shadow:var(--shadow);

  text-align:center;

}



.modal-close {

  position:absolute;

  right:12px;

  top:8px;

  width:40px;

  height:40px;

  border:0;

  background:none;

  color:#555;

  font-size:30px;

  line-height:1;

  cursor:pointer;

}



.modal-photo {

  width:150px;

  height:150px;

  margin:8px auto 18px;

  border-radius:50%;

  overflow:hidden;

  background:#eee;

}



.modal-photo img {

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

}



.modal-content h3 {

  font-size:26px;

  line-height:1.35;

  margin-bottom:7px;

  font-weight:900;

}



.modal-content h4 {

  color:#555;

  font-size:17px;

  line-height:1.55;

  margin-bottom:18px;

}



.modal-content p {

  padding-top:18px;

  border-top:1px solid #e5e5e5;

  color:#444;

  font-size:16px;

  line-height:1.8;

  font-weight:500;

  text-align:left;

  white-space:pre-line;

}



/* 手機版 */

@media(max-width:768px) {

  .section {

    padding:0 12px 30px;

  }



  .speaker-group {

    margin-top:32px;

  }



  .group-title {

    font-size:25px;

    margin-bottom:6px;

  }



  .group-title:before,

  .group-title:after {

    width:28px;

  }



  .sort-note {

    font-size:16px;

    margin-bottom:20px;

    letter-spacing:.5px;

  }



  .grid {

    grid-template-columns:repeat(2,minmax(0,1fr));

    justify-content:center;

    gap:16px 6px;

  }



  .speakers_item {

    width:100%;

    padding:10px 4px;

  }



  .speakers_item.no-photo {

    padding-top:26px;

  }



  .pic {

    width:min(40vw,150px);

    height:min(40vw,150px);

    border-width:3px;

  }



  .speakers_item h3 {

    font-size:18px;

  }



  .speakers_item h4 {

    font-size:16px;

  }



  .modal {

    padding:14px;

  }



  .modal-content {

    padding:22px 18px;

  }



  .modal-photo {

    width:130px;

    height:130px;

  }



  .modal-content h3 {

    font-size:23px;

  }



  .modal-content h4,

  .modal-content p {

    font-size:16px;

  }

}

</style>

</head>



<body>



<section class="section" id="speakerGroups"></section>



<div class="message" id="errorState" hidden>

  演講者資料暫時無法載入。

  <button id="retryButton" type="button">重新載入</button>

</div>



<!-- 講者介紹彈窗 -->

<div class="modal" id="speakerModal"

     aria-hidden="true"

     role="dialog"

     aria-modal="true">



  <div class="overlay" data-close></div>



  <div class="modal-content">



    <button class="modal-close"

            data-close

            aria-label="關閉">&times;</button>



    <div class="modal-photo" id="modalPhotoWrap">

      <img id="modalImg" src="" alt="">

    </div>



    <h3 id="modalName"></h3>

    <h4 id="modalTitle"></h4>

    <p id="modalExp"></p>



  </div>

</div>



<script>

const SHEET_ID='1QLOjgWoZ4_qE9QUyNPAjT_8KkqTDt1asy1_9ZyKlvTc';

const SHEET_GID='1348455198';



const QUERY='select AB, AC, AE, AF, AG, AH where AC is not null and AE is not null';



const CALLBACK='__receiveSpeakerSheet';

const REFRESH_MS=5*60*1000;



/* 講者照片手動維護 */

const PHOTOS={

  '林名男':'',



  '吳貞瑩':'https://image.fevercdn.com?bucket=picture-original.fevercdn.com&filepath=udn%2F2%2F219%2F3c3da0ad9ed2b4e53658f5fc.png',



  '周志鴻':'https://image.fevercdn.com?bucket=picture-original.fevercdn.com&filepath=udn%2F2%2F219%2F7d1789e428c6f5df6715fa29.png',



  '劉越萍':'https://image.fevercdn.com?bucket=picture-original.fevercdn.com&filepath=udn%2F2%2F219%2F971f523c849ab30b1872d95a.png',



  '楊博宇':'https://image.fevercdn.com?bucket=picture-original.fevercdn.com&filepath=udn%2F2%2F219%2F5e54be1573caf52972b7189b.png',



  '高聖倫':'https://image.fevercdn.com?bucket=picture-original.fevercdn.com&filepath=udn%2F2%2F219%2F3da337c29cce2a44711cd271.png',



  '韓柏檉':'https://image.fevercdn.com?bucket=picture-original.fevercdn.com&filepath=udn%2F2%2F219%2F0514351ed6532824c5088805.png',



  '張智翔':'https://image.fevercdn.com?bucket=picture-original.fevercdn.com&filepath=udn%2F2%2F219%2Fc9b2b473c74ea90fac74ddae.png',



  '姜冠宇':'https://image.fevercdn.com?bucket=picture-original.fevercdn.com&filepath=udn%2F2%2F219%2F052b07db2800f148e5b411a9.png',



  '吳淑娟':'https://image.fevercdn.com?bucket=picture-original.fevercdn.com&filepath=udn%2F2%2F219%2F2639be5844b5b40371ef2f10.png',

};



/* 照片取景位置 */

const PHOTO_POSITIONS={

  '韓柏檉':'50% 25%'

};



let pendingScript=null;

let loadTimer=null;

let SPEAKERS=[];



const groups=document.getElementById('speakerGroups');

const errorState=document.getElementById('errorState');



const modal=document.getElementById('speakerModal');

const img=document.getElementById('modalImg');

const photoWrap=document.getElementById('modalPhotoWrap');

const nameEl=document.getElementById('modalName');

const titleEl=document.getElementById('modalTitle');

const expEl=document.getElementById('modalExp');



document.getElementById('retryButton')

  .addEventListener('click',loadSpeakers);



window.addEventListener('online',loadSpeakers);

window.addEventListener('beforeunload',cleanup);



loadSpeakers();

setInterval(loadSpeakers,REFRESH_MS);



/* 讀取 Google Sheets */

function loadSpeakers(){

  cleanup();

  errorState.hidden=true;



  window[CALLBACK]=response=>{

    cleanup(false);

    clearTimeout(loadTimer);



    try {

      if(

        !response ||

        response.status==='error' ||

        !response.table

      ){

        throw new Error(

          response?.errors?.[0]?.message ||

          'Google Sheets 回傳格式不正確'

        );

      }



      const rows=response.table.rows.map((row,index)=>({

        cells:Array.from(

          {length:6},

          (_,i)=>readCell(row.c?.[i])

        ),

        index

      }));



      SPEAKERS=rows

        .map(({cells,index})=>toSpeaker(cells,index))

        .filter(Boolean)

        .sort(sortSpeakers);



      if(!SPEAKERS.length){

        throw new Error('找不到可顯示的演講者資料');

      }



      render();



      console.info(

        '[speakers] Google Sheets sync complete',

        {

          speakers:SPEAKERS.length,

          time:new Date().toISOString()

        }

      );



    }catch(error){

      showError(error);

    }

  };



  const params=new URLSearchParams({

    gid:SHEET_GID,

    headers:'2',

    tq:QUERY,

    tqx:`responseHandler:${CALLBACK}`,

    _:String(Date.now())

  });



  pendingScript=document.createElement('script');



  pendingScript.src=

    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params}`;



  pendingScript.async=true;



  pendingScript.onerror=()=>{

    showError(new Error('演講者資料連線失敗'));

  };



  document.head.appendChild(pendingScript);



  loadTimer=setTimeout(()=>{

    showError(new Error('演講者資料連線逾時'));

  },15000);

}



function cleanup(removeCallback=true){

  if(pendingScript){

    pendingScript.remove();

    pendingScript=null;

  }



  clearTimeout(loadTimer);



  if(removeCallback){

    delete window[CALLBACK];

  }

}



function readCell(cell){

  if(!cell)return '';



  if(cell.f!=null){

    return String(cell.f).trim();

  }



  return cell.v==null?'':String(cell.v).trim();

}



/* 整理講者資料 */

function toSpeaker(row,index){

  const [

    rawOrder,

    group,

    name,

    title1,

    title2,

    bio

  ]=row;



  if(!group||!name)return null;



  return {

    order:

      Number.isFinite(Number(rawOrder))&&rawOrder!==''

      ?Number(rawOrder)

      :9999,

    group,

    name,

    title1,

    title2,

    bio,

    index,

    photo:safeImage(PHOTOS[name]||''),

    photoPosition:PHOTO_POSITIONS[name]||'50% 50%'

  };

}



/* 保留原本 AB 欄排序設定 */

function sortSpeakers(a,b){

  const rank={

    '永續領航員':0,

    '永續演講者':1

  };



  return (

    (rank[a.group]??9)-(rank[b.group]??9) ||

    a.order-b.order ||

    a.index-b.index

  );

}



/*

  顯示講者資料

  新增：每個分類標題下方顯示筆畫排序說明

*/

function render(){

  const titles=[

    ...new Set(SPEAKERS.map(s=>s.group))

  ];



  groups.innerHTML=titles.map(group=>`

    <div class="speaker-group${group==='永續演講者' ? ' has-sort-note' : ''}">



      <h2 class="group-title">

        ${escapeHTML(group)}

      </h2>



      ${group==='永續演講者' ? `<p class="sort-note">※ 排列順序依照筆畫安排</p>` : ''}



      <div class="grid">

        ${SPEAKERS

          .filter(s=>s.group===group)

          .map(renderCard)

          .join('')}

      </div>



    </div>

  `).join('');

}



/* 講者卡片 */

function renderCard(s){

  const shownName=

    s.name==='(待確認)'?'邀約中':s.name;



  const interactive=Boolean(s.photo||s.bio);



  const tag=interactive?'button':'div';



  const type=interactive?' type="button"':'';



  const photo=s.photo

    ?`<div class="pic">

        <img

          src="${escapeHTML(s.photo)}"

          alt="${escapeHTML(shownName)}"

          loading="lazy"

          referrerpolicy="no-referrer"

          style="object-position:${escapeHTML(s.photoPosition)}"

        >

      </div>`

    :'';



  const roles=[s.title1,s.title2]

    .filter(Boolean)

    .map(escapeHTML)

    .join('<br>');



  const data=interactive

    ?` data-name="${escapeHTML(shownName)}"

        data-title="${escapeHTML(

          [s.title1,s.title2].filter(Boolean).join('｜')

        )}"

        data-exp="${escapeHTML(s.bio)}"

        data-img="${escapeHTML(s.photo)}"`

    :'';



  return `

    <${tag}

      class="speakers_item${s.photo?'':' no-photo'}"

      ${type}

      ${data}

    >

      ${photo}



      <h3>${escapeHTML(shownName)}</h3>



      <h4>${roles}</h4>



    </${tag}>

  `;

}



/* 開啟講者介紹 */

document.addEventListener('click',event=>{

  const card=event.target.closest(

    'button.speakers_item'

  );



  if(card){

    nameEl.textContent=card.dataset.name||'';

    titleEl.textContent=card.dataset.title||'';

    expEl.textContent=card.dataset.exp||'';



    expEl.hidden=!expEl.textContent;



    const image=card.dataset.img||'';



    if(image){

      img.src=image;

      img.alt=nameEl.textContent;

      photoWrap.hidden=false;

    }else{

      img.removeAttribute('src');

      img.alt='';

      photoWrap.hidden=true;

    }



    modal.setAttribute('aria-hidden','false');

    document.body.classList.add('modal-open');

  }



  if(event.target.closest('[data-close]')){

    closeModal();

  }

});



/* 關閉彈窗 */

function closeModal(){

  modal.setAttribute('aria-hidden','true');

  document.body.classList.remove('modal-open');

}



document.addEventListener('keydown',event=>{

  if(event.key==='Escape'){

    closeModal();

  }

});



/* 安全處理圖片網址 */

function safeImage(value){

  try{

    const url=new URL(value,document.baseURI);



    return ['https:','http:','file:'].includes(url.protocol)

      ?url.href

      :'';

  }catch{

    return '';

  }

}



/* 避免 HTML 注入 */

function escapeHTML(value){

  return String(value).replace(

    /[&<>'"]/g,

    c=>({

      '&':'&amp;',

      '<':'&lt;',

      '>':'&gt;',

      "'":'&#39;',

      '"':'&quot;'

    }[c])

  );

}



/* 錯誤處理 */

function showError(error){

  cleanup();

  errorState.hidden=false;



  console.error(

    '[speakers] Google Sheets sync failed',

    error

  );

}

</script>



</body>

</html>
