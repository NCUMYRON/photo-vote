<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>脂肪肝測驗小學堂</title>

  <style>
    .flq-quiz,
    .flq-quiz * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: transparent;
    }

    .flq-quiz {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: clamp(8px, 2vw, 14px);
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: #00b84f;
    }

    .flq-card {
      width: 100%;
      border: clamp(5px, 0.8vw, 8px) solid #00b84f;
      border-radius: clamp(12px, 1.4vw, 18px);
      padding: clamp(24px, 4vw, 48px);
      background: #f7f4e8;
    }

    .flq-title {
      margin: 0 0 8px;
      font-size: clamp(28px, 3.6vw, 44px);
      font-weight: 900;
      color: #00b84f;
      line-height: 1.2;
    }

    .flq-subtitle {
      margin: 0 0 clamp(20px, 3vw, 32px);
      font-size: clamp(14px, 1.4vw, 17px);
      font-weight: 700;
      color: #25b95d;
      line-height: 1.5;
    }

    .flq-progress {
      margin-bottom: clamp(12px, 1.6vw, 18px);
      font-size: clamp(14px, 1.3vw, 16px);
      font-weight: 800;
      color: #00b84f;
      opacity: 0.85;
    }

    .flq-question {
      margin: 0 0 clamp(18px, 2vw, 24px);
      font-size: clamp(21px, 2.4vw, 30px);
      font-weight: 900;
      line-height: 1.45;
      color: #00b84f;
    }

    .flq-options {
      display: grid;
      gap: clamp(10px, 1.3vw, 14px);
    }

    .flq-option {
      width: 100%;
      min-height: clamp(78px, 10vh, 112px);
      padding: clamp(16px, 2vw, 24px);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      text-align: left;
      background: #dff5da;
      border: 3px solid transparent;
      border-radius: clamp(6px, 0.8vw, 10px);
      color: #00a948;
      font-size: clamp(17px, 1.7vw, 21px);
      font-weight: 800;
      line-height: 1.5;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
      appearance: none;
    }

    @media (hover: hover) {
      .flq-option:hover {
        border-color: #00b84f;
        transform: translateY(-1px);
      }
    }

    .flq-option:focus-visible,
    .flq-submit:focus-visible {
      outline: 3px solid rgba(0, 184, 79, 0.35);
      outline-offset: 3px;
    }

    .flq-option.is-selected {
      border-color: #00b84f;
      background: #c9f3bd;
    }

    .flq-option.is-correct {
      border-color: #00b84f;
      background: #c9f3bd;
    }

    .flq-option.is-wrong {
      border-color: #ff5b5b;
      background: #ffe1df;
      color: #d60000;
    }

    .flq-option:disabled {
      cursor: default;
      opacity: 1;
    }

    .flq-submit {
      width: 100%;
      min-height: clamp(52px, 6vh, 62px);
      margin-top: clamp(14px, 1.8vw, 20px);
      border: none;
      border-radius: 999px;
      background: #dfff7a;
      color: #00b84f;
      font-size: clamp(20px, 2vw, 24px);
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
      transition: filter 0.2s ease, transform 0.2s ease;
      appearance: none;
    }

    @media (hover: hover) {
      .flq-submit:hover {
        filter: brightness(0.98);
        transform: translateY(-1px);
      }
    }

    .flq-message {
      display: none;
      margin-top: clamp(16px, 2vw, 22px);
      padding: clamp(16px, 2vw, 22px);
      border-radius: 12px;
      background: #ffffff;
      border: 2px solid #c9f3bd;
      color: #177d42;
      font-size: clamp(15px, 1.45vw, 17px);
      font-weight: 700;
      line-height: 1.65;
    }

    .flq-message.is-show {
      display: block;
    }

    .flq-answer-label {
      margin-bottom: 6px;
      font-size: clamp(17px, 1.6vw, 19px);
      font-weight: 900;
      color: #00b84f;
      line-height: 1.5;
    }

    .flq-footer {
      margin-top: 14px;
      text-align: center;
      font-size: clamp(11px, 1vw, 12px);
      font-weight: 700;
      color: #35c56a;
      line-height: 1.5;
    }

    .flq-result {
      padding: clamp(22px, 3vw, 32px);
      border-radius: 14px;
      background: #dff5da;
      color: #00a948;
      font-weight: 900;
      line-height: 1.6;
    }

    .flq-result-score {
      margin-bottom: 12px;
      font-size: clamp(32px, 4vw, 42px);
      line-height: 1.2;
    }

    .flq-result-text {
      font-size: clamp(18px, 2vw, 22px);
    }

    @media (max-width: 600px) {
      .flq-quiz {
        padding: 8px;
      }

      .flq-card {
        padding: 24px 18px 22px;
        border-width: 5px;
        border-radius: 12px;
      }

      .flq-title {
        font-size: 28px;
      }

      .flq-subtitle {
        font-size: 14px;
        margin-bottom: 22px;
      }

      .flq-progress {
        font-size: 14px;
        margin-bottom: 12px;
      }

      .flq-question {
        font-size: 21px;
        line-height: 1.45;
        margin-bottom: 18px;
      }

      .flq-option {
        min-height: auto;
        padding: 17px 14px;
        font-size: 16.5px;
        line-height: 1.5;
        border-width: 2px;
      }

      .flq-submit {
        min-height: 52px;
        font-size: 19px;
      }

      .flq-message {
        font-size: 15.5px;
        line-height: 1.6;
        padding: 16px;
      }
    }

    @media (max-width: 390px) {
      .flq-card {
        padding: 22px 14px 20px;
      }

      .flq-title {
        font-size: 25px;
      }

      .flq-question {
        font-size: 19px;
      }

      .flq-option {
        font-size: 15.5px;
        padding: 15px 12px;
      }

      .flq-submit {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="flq-quiz" id="fattyLiverQuiz">
    <section class="flq-card" aria-labelledby="flqTitle">
      <h1 class="flq-title" id="flqTitle">脂肪肝測驗小學堂</h1>
      <p class="flq-subtitle">測測看，你對脂肪肝了解多少？</p>

      <div class="flq-progress" id="flqProgress"></div>
      <h2 class="flq-question" id="flqQuestion"></h2>

      <div class="flq-options" id="flqOptions"></div>

      <button class="flq-submit" id="flqSubmit" type="button">送出答案</button>

      <div class="flq-message" id="flqMessage" aria-live="polite"></div>

      <div class="flq-footer">完成測驗後即可查看分數與解析</div>
    </section>
  </div>

  <script>
    (function () {
      const questions = [
        {
          question: "Q1. 以下哪個工具或指標可以確診脂肪肝炎？",
          options: [
            "A. BMI身體質量指數",
            "B. 抽血檢查血液脂肪濃度",
            "C. 腹部超音波"
          ],
          answer: 2,
          answerText: "C. 腹部超音波",
          explanation:
            "腹部超音波是目前篩檢與診斷脂肪肝的工具，依據肝臟亮度、血管清晰度與深部影像來判斷輕、中、重度；抽血通常用於評估是否已導致肝發炎，BMI則僅為風險指標。"
        },
        {
          question: "Q2. 脂肪肝若長期不處理，會產生心肌梗塞、中風等心血管疾病與洗腎風險。",
          options: [
            "是",
            "否"
          ],
          answer: 0,
          answerText: "是",
          explanation:
            "由於脂肪肝初期幾乎沒有明顯症狀，若未及早控制，可能進一步演變為慢性肝病、肝硬化，甚至肝癌。脂肪肝、肥胖、三高、糖尿病與心血管疾病彼此互相影響、惡性循環，恐變為「心腎代謝症候群」（CKM）。"
        },
        {
          question: "Q3. 想要逆轉脂肪肝，下列哪一項說法是正確的？",
          options: [
            "A. 目前台灣已有核准第一個用於治療脂肪肝炎的藥物，為減重藥物GLP-1受體促效劑 semaglutide（俗稱瘦瘦針），並搭配運動及飲食，減少脂肪堆積在肝臟。",
            "B. 只要吃保肝保健食品，不必減重或運動。",
            "C. 只要體重正常，不需要在意脂肪肝。"
          ],
          answer: 0,
          answerText:
            "A. 目前台灣已有核准用於治療脂肪肝炎，如減重藥物GLP-1受體促效劑 semaglutide，並搭配運動及飲食，減少脂肪堆積在肝臟。",
          explanation:
            "脂肪肝與肥胖、三高密切相關，需減重約一成並調整飲食、運動習慣。目前GLP-1受體促效劑 semaglutide 可提升代謝、降低食慾，幫助減重並減少肝臟脂肪堆積，已被國際心臟科與肝病治療指引建議用於合併代謝問題的脂肪肝患者。"
        }
      ];

      const root = document.getElementById("fattyLiverQuiz");
      const progress = document.getElementById("flqProgress");
      const questionText = document.getElementById("flqQuestion");
      const optionsContainer = document.getElementById("flqOptions");
      const submitBtn = document.getElementById("flqSubmit");
      const message = document.getElementById("flqMessage");

      let currentQuestionIndex = 0;
      let selectedAnswer = null;
      let score = 0;
      let hasSubmitted = false;
      let quizFinished = false;

      function loadQuestion() {
        const currentQuestion = questions[currentQuestionIndex];

        selectedAnswer = null;
        hasSubmitted = false;
        quizFinished = false;

        progress.textContent = `第 ${currentQuestionIndex + 1} 題 / 共 ${questions.length} 題`;
        questionText.textContent = currentQuestion.question;
        optionsContainer.innerHTML = "";
        message.classList.remove("is-show");
        message.innerHTML = "";
        submitBtn.textContent = "送出答案";

        currentQuestion.options.forEach(function (optionText, index) {
          const option = document.createElement("button");
          option.className = "flq-option";
          option.type = "button";
          option.textContent = optionText;
          option.dataset.index = index;
          option.setAttribute("aria-pressed", "false");

          option.addEventListener("click", function () {
            if (hasSubmitted || quizFinished) return;

            const allOptions = optionsContainer.querySelectorAll(".flq-option");

            allOptions.forEach(function (item) {
              item.classList.remove("is-selected");
              item.setAttribute("aria-pressed", "false");
            });

            option.classList.add("is-selected");
            option.setAttribute("aria-pressed", "true");
            selectedAnswer = index;
            notifyHeightChange();
          });

          optionsContainer.appendChild(option);
        });

        notifyHeightChange();
      }

      function submitAnswer() {
        const currentQuestion = questions[currentQuestionIndex];

        if (selectedAnswer === null) {
          message.classList.add("is-show");
          message.innerHTML = "請先選擇一個答案。";
          notifyHeightChange();
          return;
        }

        hasSubmitted = true;

        const isCorrect = selectedAnswer === currentQuestion.answer;

        if (isCorrect) {
          score++;
        }

        const allOptions = optionsContainer.querySelectorAll(".flq-option");

        allOptions.forEach(function (option) {
          const optionIndex = Number(option.dataset.index);
          option.disabled = true;

          if (optionIndex === currentQuestion.answer) {
            option.classList.add("is-correct");
          }

          if (optionIndex === selectedAnswer && !isCorrect) {
            option.classList.add("is-wrong");
          }
        });

        message.classList.add("is-show");
        message.innerHTML = `
          <div class="flq-answer-label">
            ${isCorrect ? "答對了！" : "答錯了！"}正確答案：${currentQuestion.answerText}
          </div>
          <div>${currentQuestion.explanation}</div>
        `;

        submitBtn.textContent =
          currentQuestionIndex === questions.length - 1 ? "查看結果" : "下一題";

        notifyHeightChange();
      }

      function goToNextQuestion() {
        currentQuestionIndex++;

        if (currentQuestionIndex < questions.length) {
          loadQuestion();
        } else {
          showResult();
        }
      }

      function showResult() {
        quizFinished = true;
        hasSubmitted = false;

        progress.textContent = "測驗完成";
        questionText.textContent = "";

        optionsContainer.innerHTML = `
          <div class="flq-result">
            <div class="flq-result-score">${score} / ${questions.length} 題答對</div>
            <div class="flq-result-text">${getResultText(score)}</div>
          </div>
        `;

        message.classList.remove("is-show");
        message.innerHTML = "";
        submitBtn.textContent = "重新測驗";

        notifyHeightChange();
      }

      function restartQuiz() {
        currentQuestionIndex = 0;
        selectedAnswer = null;
        score = 0;
        hasSubmitted = false;
        quizFinished = false;
        loadQuestion();
      }

      function getResultText(score) {
        if (score === questions.length) {
          return "太厲害了！你對脂肪肝的風險與改善方式有很好的基本認識。";
        }

        if (score === 2) {
          return "很不錯！已經掌握大部分重點，可以再複習一下答錯的題目。";
        }

        if (score === 1) {
          return "你已經開始認識脂肪肝了，建議再看一次解析，加深印象。";
        }

        return "別擔心，脂肪肝常常沒有明顯症狀，透過測驗開始了解就是第一步。";
      }

      function notifyHeightChange() {
        window.requestAnimationFrame(function () {
          const height = Math.ceil(document.documentElement.scrollHeight);

          if (window.parent && window.parent !== window) {
            window.parent.postMessage(
              {
                type: "fatty-liver-quiz-height",
                height: height
              },
              "*"
            );
          }
        });
      }

      submitBtn.addEventListener("click", function () {
        if (quizFinished) {
          restartQuiz();
          return;
        }

        if (!hasSubmitted) {
          submitAnswer();
        } else {
          goToNextQuestion();
        }
      });

      if ("ResizeObserver" in window) {
        const resizeObserver = new ResizeObserver(notifyHeightChange);
        resizeObserver.observe(root);
      }

      window.addEventListener("load", notifyHeightChange);
      window.addEventListener("resize", notifyHeightChange);

      loadQuestion();
    })();
  </script>
</body>
</html>
