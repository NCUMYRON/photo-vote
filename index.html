<body>
  <main class="page">
    <section class="hero">
      <picture class="hero-picture">
        <source id="mobileHero" media="(max-width: 680px)" srcset="https://image.fevercdn.com/?bucket=picture-original.fevercdn.com&filepath=udn%2F2%2F205%2F46a14f26e994637a9c85fd05.jpg">
        <img id="desktopHero" src="https://image.fevercdn.com/?bucket=picture-original.fevercdn.com&filepath=udn%2F2%2F231%2F5fea2a8e71e106fd4525637d.jpeg" alt="台灣新視代 照片人氣投票">
      </picture>
    </section>

    <div class="hero-group-tabs">
      <button class="group-btn active" data-group="social">社會組</button>
      <button class="group-btn" data-group="college">大專組</button>
    </div>

    <section class="works-area" id="works">
      <div class="works-header">
        <div class="works-title">參賽作品</div>
      </div>

      <div class="works-search-zone" id="worksSearchZone">
        <button class="search-toggle-btn" id="searchToggleBtn" type="button" aria-expanded="false">
          <span class="search-btn-text">⌕ 搜尋作品</span>
        </button>

        <div class="search-box">
          <input class="search-input" id="searchInput" placeholder="搜尋作品編號、作品名稱、參賽者或拍攝主題" type="text" />
          <button aria-label="清除搜尋" class="search-clear" id="clearSearchBtn" type="button">×</button>
          <div class="search-icon">⌕</div>
        </div>
      </div>
    </section>

    <section class="gallery skeleton-gallery" id="skeletonGallery">
      <article class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-actions"><div class="skeleton-button"></div><div class="skeleton-count"></div></div></div></article>
      <article class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-actions"><div class="skeleton-button"></div><div class="skeleton-count"></div></div></div></article>
      <article class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-actions"><div class="skeleton-button"></div><div class="skeleton-count"></div></div></div></article>
      <article class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-actions"><div class="skeleton-button"></div><div class="skeleton-count"></div></div></div></article>
      <article class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-actions"><div class="skeleton-button"></div><div class="skeleton-count"></div></div></div></article>
    </section>

    <section class="gallery" id="gallery" style="display:none;"></section>

    <div class="infinite-scroll-wrap" id="infiniteScrollWrap" hidden>
      <div class="infinite-scroll-status" id="infiniteScrollStatus">繼續往下滑，更多作品將自動載入</div>
      <div class="infinite-scroll-sentinel" id="infiniteScrollSentinel" aria-hidden="true"></div>
    </div>
  </main>

  <div class="modal" id="detailModal">
    <div class="modal-dialog">
      <div class="detail-panel">
        <div class="detail-media">
          <div class="detail-image">
            <img alt="" id="modalImage" src="" />
          </div>

          <div class="modal-nav">
            <button class="modal-nav-btn" id="prevWorkBtn" type="button">← 上一件作品</button>
            <button class="modal-nav-btn" id="nextWorkBtn" type="button">下一件作品 →</button>
          </div>
        </div>

        <div class="detail-info">
          <div class="detail-tool-row">
            <div class="modal-search-zone" id="modalSearchZone">
              <button class="modal-search-toggle" id="modalSearchToggle" type="button">⌕ 搜尋其他作品</button>

              <div class="modal-search-box">
                <input class="modal-search-input" id="modalSearchInput" placeholder="搜尋作品編號、作品名稱、參賽者" type="text">
                <button class="modal-search-submit" id="modalSearchSubmit" type="button" aria-label="搜尋">⌕</button>
                <div class="modal-search-results" id="modalSearchResults"></div>
              </div>
            </div>

            <button class="copy-link-btn" id="copyLinkBtn" type="button" aria-label="複製作品連結">複製連結</button>
            <button aria-label="關閉視窗" class="modal-info-close" id="modalClose" type="button">×</button>
          </div>

          <div class="detail-top-labels">
            <div class="detail-label group" id="modalGroup"></div>
            <div class="detail-label theme" id="modalTheme"></div>
          </div>

          <h2 class="detail-title" id="modalTitle"></h2>

          <div class="detail-meta-row">
            <div class="detail-brief">
              <div class="detail-item detail-author-item">參賽者｜<span id="modalBriefAuthor"></span></div>
              <div class="detail-item detail-number-item">作品編號｜<span id="modalBriefNumber"></span></div>
            </div>
            <div class="detail-vote-count">人氣票數 <span id="modalVotes"></span></div>
          </div>

          <div class="detail-story">
            <div class="detail-story-label">作品自述</div>
            <div class="detail-description" id="modalDescription"></div>
            <span class="description-toggle" id="descriptionToggle" hidden>展開全文</span>
          </div>

          <div class="detail-action-row detail-bottom-action">
            <button class="vote-btn" id="modalVoteBtn">投這個作品一票</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyjF8idieIUWms-JI-1sGyQe7tRzPdd5SEagG8fwZG9C-1IWQLY7wi1k6lLmVo8ftp1Xg/exec";
    const INITIAL_VISIBLE_COUNT = 20;
    const LOCAL_WORKS_CACHE_KEY = "photo_vote_local_works_cache_v5_fairness";
    const LOCAL_WORKS_CACHE_TTL = 5 * 60 * 1000;
    const TRACKING_STORAGE_PREFIX = "photo_vote_tracking_";
    const CARD_EXPOSURE_DELAY = 800;
    const TRACKING_FLUSH_DELAY = 1800;
    const TRACKING_BATCH_LIMIT = 12;

    let works = [];
    let currentGroup = "social";
    let currentKeyword = "";
    let currentWorkId = null;
    let currentModalSequence = [];
    let currentModalIndex = -1;
    let visibleCount = INITIAL_VISIBLE_COUNT;
    let remoteWorksLoaded = false;
    let infiniteAutoLoading = false;
    let pendingDeepLinkValue = getDeepLinkValueFromUrl();
    let hasHandledInitialDeepLink = false;

    const votedToday = new Set();
    const pendingVotes = new Set();
    const voterId = getOrCreateVoterId();

    const trackingDateKey = getTrackingDateKey();
    const trackedDailyKeys = new Set(readDailyTrackingKeys());
    const trackingQueue = [];
    let trackingFlushTimer = null;

    let infiniteScrollObserver = null;
    let cardExposureObserver = null;
    const cardExposureTimers = new Map();

    function getOrCreateVoterId() {
      const storageKey = "photo_vote_voter_id";
      let id = localStorage.getItem(storageKey);

      if (!id) {
        id = (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : "voter_" + Date.now() + "_" + Math.random().toString(36).slice(2, 12);

        localStorage.setItem(storageKey, id);
      }

      return id;
    }

    function getTrackingDateKey() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function readDailyTrackingKeys() {
      try {
        const raw = localStorage.getItem(`${TRACKING_STORAGE_PREFIX}${trackingDateKey}`);
        const parsed = JSON.parse(raw || "[]");
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        return [];
      }
    }

    function persistDailyTrackingKeys() {
      try {
        localStorage.setItem(
          `${TRACKING_STORAGE_PREFIX}${trackingDateKey}`,
          JSON.stringify(Array.from(trackedDailyKeys))
        );
      } catch (error) {}
    }

    function makeEventDailyKey(eventType, workId) {
      return `${eventType}::${workId}`;
    }

    function getDeepLinkValueFromUrl() {
      try {
        const params = new URLSearchParams(window.location.search);
        return String(params.get("work") || "").trim();
      } catch (error) {
        return "";
      }
    }

    function resolveWorkByLookupValue(value) {
      const lookup = String(value || "").trim().toLowerCase();
      if (!lookup) return null;

      return works.find(work =>
        String(work.display_number || "").trim().toLowerCase() === lookup ||
        String(work.work_id || "").trim().toLowerCase() === lookup
      ) || null;
    }

    function updateDeepLinkUrl(work) {
      try {
        const url = new URL(window.location.href);
        const shareKey = String(work.display_number || work.work_id || "").trim();
        if (!shareKey) return;
        url.searchParams.set("work", shareKey);
        window.history.replaceState({}, "", url.toString());
      } catch (error) {}
    }

    function removeDeepLinkUrl() {
      try {
        const url = new URL(window.location.href);
        url.searchParams.delete("work");
        window.history.replaceState({}, "", url.toString());
      } catch (error) {}
    }

    function buildShareUrl(work) {
      try {
        const url = new URL(window.location.href);
        const shareKey = String(work.display_number || work.work_id || "").trim();
        url.searchParams.set("work", shareKey);
        return url.toString();
      } catch (error) {
        return window.location.href;
      }
    }

    async function copyCurrentWorkLink() {
      const work = works.find(item => item.work_id === currentWorkId);
      if (!work) {
        showToast("目前找不到可複製的作品連結。");
        return;
      }

      const shareUrl = buildShareUrl(work);

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(shareUrl);
        } else {
          const helper = document.createElement("textarea");
          helper.value = shareUrl;
          helper.setAttribute("readonly", "");
          helper.style.position = "fixed";
          helper.style.opacity = "0";
          document.body.appendChild(helper);
          helper.select();
          document.execCommand("copy");
          helper.remove();
        }

        showToast("已複製這件作品的分享連結！");
        queueTrackingEvent("share_link_copy", work, "modal_share_button", false);
      } catch (error) {
        showToast("連結複製失敗，請再試一次。");
      }
    }

    async function loadWorks() {
      const hasLocalWorks = restoreWorksFromLocalCache();

      if (hasLocalWorks) {
        showGalleryImmediately();
        renderGallery("快取資料");
        handleInitialDeepLinkIfReady();
      }

      fetchVotedTodayInBackground();

      try {
        const url = `${API_URL}?action=getWorksFast&t=${Date.now()}`;
        const response = await fetch(url);
        const data = await response.json();

        if (!data.ok) throw new Error(data.message || "作品資料載入失敗");

        works = Array.isArray(data.works) ? data.works : [];
        remoteWorksLoaded = true;
        saveWorksToLocalCache(works);
        showGalleryImmediately();
        renderGallery();
        handleInitialDeepLinkIfReady();
      } catch (error) {
        if (!hasLocalWorks) showWorksLoadError(error.message || "請稍後再試");
        else showToast("已先顯示作品，最新資料同步稍後再試");
      }
    }

    async function fetchVotedTodayInBackground() {
      try {
        const url = `${API_URL}?action=getVotedToday&voter_id=${encodeURIComponent(voterId)}&t=${Date.now()}`;
        const response = await fetch(url);
        const data = await response.json();

        if (!data.ok) return;

        votedToday.clear();
        (data.voted_today || []).forEach(workId => votedToday.add(workId));

        renderGallery(remoteWorksLoaded ? "" : "快取資料");

        if (currentWorkId) updateModalVoteButton(currentWorkId);
      } catch (error) {}
    }

    function restoreWorksFromLocalCache() {
      try {
        const raw = localStorage.getItem(LOCAL_WORKS_CACHE_KEY);
        if (!raw) return false;

        const payload = JSON.parse(raw);

        if (
          Date.now() - Number(payload.saved_at || 0) > LOCAL_WORKS_CACHE_TTL ||
          !Array.isArray(payload.works)
        ) return false;

        works = payload.works;
        return works.length > 0;
      } catch (error) {
        return false;
      }
    }

    function saveWorksToLocalCache(latestWorks) {
      try {
        localStorage.setItem(
          LOCAL_WORKS_CACHE_KEY,
          JSON.stringify({ saved_at: Date.now(), works: latestWorks })
        );
      } catch (error) {}
    }

    function showGalleryImmediately() {
      document.getElementById("skeletonGallery").style.display = "none";
      document.getElementById("gallery").style.display = "grid";
    }

    function showWorksLoadError(message) {
      document.getElementById("skeletonGallery").innerHTML =
        `<div class="empty-state"><h3>作品載入失敗</h3><p>${escapeHtml(message)}</p></div>`;

      showToast("作品載入失敗，請稍後再試");
    }

    function getFilteredSortedWorks() {
      let result = works.filter(work => work.group_key === currentGroup);

      if (currentKeyword.trim()) {
        const keyword = currentKeyword.trim().toLowerCase();

        result = result.filter(work =>
          [
            work.display_number,
            work.work_name,
            work.participant_name,
            work.shooting_theme
          ].join(" ").toLowerCase().includes(keyword)
        );
      }

      result.sort((a, b) =>
        String(a.display_number || "").localeCompare(
          String(b.display_number || ""),
          "zh-Hant",
          { numeric: true }
        )
      );

      return result;
    }

    function renderGallery() {
      const gallery = document.getElementById("gallery");
      const infiniteWrap = document.getElementById("infiniteScrollWrap");
      const infiniteStatus = document.getElementById("infiniteScrollStatus");
      const filteredWorks = getFilteredSortedWorks();
      const displayedWorks = filteredWorks.slice(0, visibleCount);

      disconnectCardExposureObserver();

      if (!filteredWorks.length) {
        infiniteWrap.hidden = true;
        gallery.innerHTML =
          `<div class="empty-state">
            <h3>找不到符合條件的作品</h3>
            <p>請換個關鍵字，或一鍵清除搜尋後重新瀏覽。</p>
            <button class="empty-clear-btn" type="button" onclick="clearSearch()">清除搜尋，查看全部作品</button>
          </div>`;
        return;
      }

      gallery.innerHTML = displayedWorks.map(work => {
        const isVoted = votedToday.has(work.work_id);
        const isLoading = pendingVotes.has(work.work_id);

        return `
          <article class="photo-card" data-work-id="${escapeHtml(work.work_id)}">
            <div class="photo-click-area" onclick="openModal('${escapeJs(work.work_id)}', 'list_card')">
              <div class="photo-wrap">
                <img src="${escapeHtml(work.image_url)}" alt="${escapeHtml(work.work_name)}" loading="lazy" decoding="async">
                <div class="detail-hint">查看作品介紹</div>
              </div>
            </div>

            <div class="card-body">
              <div class="card-meta-row">
                <div class="work-number">${escapeHtml(work.display_number)}</div>
                <div class="card-author">參賽者｜${escapeHtml(work.participant_name)}</div>
              </div>

              <div class="card-main">
                <h3 class="card-title photo-click-area" onclick="openModal('${escapeJs(work.work_id)}', 'list_title')">
                  ${escapeHtml(work.work_name)}
                </h3>
              </div>

              <div class="card-actions">
                <button class="vote-btn ${isVoted ? "voted" : ""} ${isLoading ? "loading" : ""}" onclick="voteWork('${escapeJs(work.work_id)}')">
                  ${isVoted ? "已投下這一票" : isLoading ? "投票送出中…" : "投這個作品一票"}
                </button>
                <div class="vote-count">${Number(work.votes || 0)}<small>票</small></div>
              </div>
            </div>
          </article>`;
      }).join("");

      const remaining = filteredWorks.length - displayedWorks.length;
      infiniteWrap.hidden = remaining <= 0;
      infiniteStatus.classList.remove("loading");
      infiniteStatus.textContent = remaining > 0
        ? `繼續往下滑，尚有 ${remaining} 件作品將自動載入`
        : "已顯示目前條件下的全部作品";

      observeCardsForExposure();
      reconnectInfiniteScrollObserver();
    }

    function reconnectInfiniteScrollObserver() {
      const sentinel = document.getElementById("infiniteScrollSentinel");
      if (!sentinel) return;

      if (infiniteScrollObserver) {
        infiniteScrollObserver.disconnect();
      }

      infiniteScrollObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) autoLoadMoreWorks();
        });
      }, {
        root: null,
        rootMargin: "700px 0px 700px 0px",
        threshold: 0
      });

      infiniteScrollObserver.observe(sentinel);
    }

    function autoLoadMoreWorks() {
      if (infiniteAutoLoading) return;

      const filteredWorks = getFilteredSortedWorks();
      if (visibleCount >= filteredWorks.length) return;

      infiniteAutoLoading = true;
      const infiniteStatus = document.getElementById("infiniteScrollStatus");
      infiniteStatus.classList.add("loading");
      infiniteStatus.textContent = "更多作品載入中…";

      window.setTimeout(() => {
        visibleCount = Math.min(visibleCount + INITIAL_VISIBLE_COUNT, filteredWorks.length);
        renderGallery();
        infiniteAutoLoading = false;
      }, 180);
    }

    function disconnectCardExposureObserver() {
      if (cardExposureObserver) {
        cardExposureObserver.disconnect();
        cardExposureObserver = null;
      }

      cardExposureTimers.forEach(timer => clearTimeout(timer));
      cardExposureTimers.clear();
    }

    function observeCardsForExposure() {
      const cards = document.querySelectorAll(".photo-card[data-work-id]");
      if (!cards.length) return;

      cardExposureObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const card = entry.target;
          const workId = card.dataset.workId;
          const work = works.find(item => item.work_id === workId);
          if (!work) return;

          if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
            if (cardExposureTimers.has(workId)) return;

            const timer = setTimeout(() => {
              queueTrackingEvent("card_exposure", work, "list_visible", true);
              cardExposureTimers.delete(workId);
            }, CARD_EXPOSURE_DELAY);

            cardExposureTimers.set(workId, timer);
          } else {
            const timer = cardExposureTimers.get(workId);
            if (timer) clearTimeout(timer);
            cardExposureTimers.delete(workId);
          }
        });
      }, {
        root: null,
        threshold: [0, 0.5, 1]
      });

      cards.forEach(card => cardExposureObserver.observe(card));
    }

    function queueTrackingEvent(eventType, work, source, dedupeDaily = true) {
      if (!work || !work.work_id) return;

      const dailyKey = makeEventDailyKey(eventType, work.work_id);
      if (dedupeDaily && trackedDailyKeys.has(dailyKey)) return;

      if (dedupeDaily) {
        trackedDailyKeys.add(dailyKey);
        persistDailyTrackingKeys();
      }

      trackingQueue.push({
        event_type: eventType,
        work_id: work.work_id,
        display_number: work.display_number || "",
        group_key: work.group_key || "",
        group_name: work.group_name || "",
        source: source || "",
        viewer_id: voterId,
        page_url: window.location.href,
        referrer: document.referrer || "",
        user_agent: navigator.userAgent || ""
      });

      if (trackingQueue.length >= TRACKING_BATCH_LIMIT) {
        flushTrackingQueue();
      } else {
        scheduleTrackingFlush();
      }
    }

    function scheduleTrackingFlush() {
      if (trackingFlushTimer) return;

      trackingFlushTimer = window.setTimeout(() => {
        trackingFlushTimer = null;
        flushTrackingQueue();
      }, TRACKING_FLUSH_DELAY);
    }

    async function flushTrackingQueue() {
      if (!trackingQueue.length) return;

      const events = trackingQueue.splice(0, trackingQueue.length);

      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "trackEvents",
            events
          })
        });
      } catch (error) {
        // 追蹤失敗時不干擾投票流程
      }
    }

    window.addEventListener("pagehide", () => {
      flushTrackingQueue();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") flushTrackingQueue();
    });

    function handleInitialDeepLinkIfReady() {
      if (hasHandledInitialDeepLink || !pendingDeepLinkValue || !works.length) return;

      const targetWork = resolveWorkByLookupValue(pendingDeepLinkValue);
      hasHandledInitialDeepLink = true;

      if (!targetWork) {
        showToast("找不到這個作品連結，已先顯示作品列表。");
        return;
      }

      currentGroup = targetWork.group_key || currentGroup;
      document.querySelectorAll(".group-btn").forEach(btn =>
        btn.classList.toggle("active", btn.dataset.group === currentGroup)
      );

      visibleCount = Math.max(
        INITIAL_VISIBLE_COUNT,
        getFilteredSortedWorks().findIndex(work => work.work_id === targetWork.work_id) + 1
      );

      renderGallery();
      openModal(targetWork.work_id, "deep_link");
    }

    function openModal(workId, source = "list_card") {
      const work = works.find(item => item.work_id === workId);
      if (!work) return;

      currentModalSequence = getFilteredSortedWorks();
      currentModalIndex = currentModalSequence.findIndex(item => item.work_id === workId);

      renderModalByWork(work, source);
      document.getElementById("detailModal").classList.add("show");
      document.body.classList.add("modal-open");
    }

    function renderModalByWork(work, source = "modal_navigation") {
      currentWorkId = work.work_id;

      document.getElementById("modalImage").src = work.image_url;
      document.getElementById("modalImage").alt = work.work_name;
      document.getElementById("modalGroup").textContent = work.group_name;
      document.getElementById("modalTheme").textContent = work.shooting_theme;
      document.getElementById("modalTitle").textContent = work.work_name;
      document.getElementById("modalBriefAuthor").textContent = work.participant_name;
      document.getElementById("modalBriefNumber").textContent = work.display_number;
      document.getElementById("modalVotes").textContent = Number(work.votes || 0);

      renderDescription(work.description || "");
      updateModalVoteButton(work.work_id);
      updateModalNavigation();
      updateDeepLinkUrl(work);

      queueTrackingEvent("detail_open", work, source, true);

      if (source === "deep_link") {
        queueTrackingEvent("deep_link_open", work, "url_query", true);
      }
    }

    function renderDescription(description) {
      const descriptionEl = document.getElementById("modalDescription");
      const toggleEl = document.getElementById("descriptionToggle");
      const normalizedDescription = String(description || "").trim();

      descriptionEl.textContent = normalizedDescription || "此作品尚未提供自述。";
      descriptionEl.classList.remove("is-collapsible", "is-expanded");
      toggleEl.hidden = true;
      toggleEl.textContent = "展開全文";
      toggleEl.setAttribute("aria-expanded", "false");

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          descriptionEl.classList.add("is-collapsible");
          const isActuallyHidden = descriptionEl.scrollHeight > descriptionEl.clientHeight + 2;

          if (isActuallyHidden) toggleEl.hidden = false;
          else {
            descriptionEl.classList.remove("is-collapsible");
            toggleEl.hidden = true;
          }
        });
      });
    }

    function toggleDescription() {
      const descriptionEl = document.getElementById("modalDescription");
      const toggleEl = document.getElementById("descriptionToggle");
      const isExpanded = descriptionEl.classList.contains("is-expanded");

      if (isExpanded) {
        descriptionEl.classList.remove("is-expanded");
        descriptionEl.classList.add("is-collapsible");
        toggleEl.textContent = "展開全文";
        toggleEl.setAttribute("aria-expanded", "false");
      } else {
        descriptionEl.classList.remove("is-collapsible");
        descriptionEl.classList.add("is-expanded");
        toggleEl.textContent = "收合內容";
        toggleEl.setAttribute("aria-expanded", "true");
      }
    }

    function closeModal() {
      document.getElementById("detailModal").classList.remove("show");
      document.body.classList.remove("modal-open");
      currentWorkId = null;
      currentModalSequence = [];
      currentModalIndex = -1;
      removeDeepLinkUrl();
    }

    function updateModalVoteButton(workId) {
      const button = document.getElementById("modalVoteBtn");
      const isVoted = votedToday.has(workId);
      const isLoading = pendingVotes.has(workId);

      button.classList.toggle("voted", isVoted);
      button.classList.toggle("loading", isLoading);
      button.textContent = isVoted
        ? "已投下這一票"
        : isLoading
          ? "投票送出中…"
          : "投這個作品一票";
    }

    function updateModalNavigation() {
      document.getElementById("prevWorkBtn").disabled = currentModalIndex <= 0;
      document.getElementById("nextWorkBtn").disabled = currentModalIndex >= currentModalSequence.length - 1;
    }

    function showPreviousWork() {
      if (currentModalIndex > 0) {
        renderModalByWork(currentModalSequence[--currentModalIndex], "modal_navigation");
      }
    }

    function showNextWork() {
      if (currentModalIndex < currentModalSequence.length - 1) {
        renderModalByWork(currentModalSequence[++currentModalIndex], "modal_navigation");
      }
    }

    document.getElementById("prevWorkBtn").addEventListener("click", showPreviousWork);
    document.getElementById("nextWorkBtn").addEventListener("click", showNextWork);

    async function voteWork(workId) {
      if (votedToday.has(workId)) {
        showToast("你今天已經投過這件作品囉！");
        return;
      }

      if (pendingVotes.has(workId)) return;

      const target = works.find(item => item.work_id === workId);

      if (!target) {
        showToast("找不到這件作品，請重新整理後再試。");
        return;
      }

      const previousVotes = Number(target.votes || 0);

      pendingVotes.add(workId);
      votedToday.add(workId);
      target.votes = previousVotes + 1;

      renderGallery();

      if (currentWorkId === workId) {
        document.getElementById("modalVotes").textContent = target.votes;
        updateModalVoteButton(workId);
      }

      triggerVoteSuccessAnimation(workId);
      showToast("已成功投票！謝謝你支持這件作品。");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "vote",
            work_id: workId,
            voter_id: voterId
          })
        });

        const data = await response.json();

        if (!data.ok) {
          if (data.code === "DUPLICATE_TODAY") {
            target.votes = previousVotes;
            showToast("你今天已經投過這件作品囉！");
          } else {
            target.votes = previousVotes;
            votedToday.delete(workId);
            throw new Error(data.message || "投票失敗");
          }
        } else {
          target.votes = Number(data.votes || target.votes || 0);
          saveWorksToLocalCache(works);
        }
      } catch (error) {
        target.votes = previousVotes;
        votedToday.delete(workId);
        showToast(error.message || "投票失敗，請稍後再試");
      } finally {
        pendingVotes.delete(workId);
        renderGallery();

        if (currentWorkId === workId) {
          document.getElementById("modalVotes").textContent = Number(target.votes || 0);
          updateModalVoteButton(workId);
        }
      }
    }

    function triggerVoteSuccessAnimation(workId) {
      const card = document.querySelector(`[data-work-id="${cssEscape(workId)}"]`);

      if (card) {
        const count = card.querySelector(".vote-count");
        const button = card.querySelector(".vote-btn");

        if (count) {
          count.classList.add("vote-pulse");
          setTimeout(() => count.classList.remove("vote-pulse"), 800);
        }

        if (button) {
          button.classList.add("vote-success-pop");
          setTimeout(() => button.classList.remove("vote-success-pop"), 600);
        }
      }

      if (currentWorkId === workId) {
        const modalCount = document.getElementById("modalVotes");
        modalCount.classList.add("vote-pulse");
        setTimeout(() => modalCount.classList.remove("vote-pulse"), 800);
      }
    }

    function setGroup(group) {
      currentGroup = group;
      currentKeyword = "";
      visibleCount = INITIAL_VISIBLE_COUNT;

      document.getElementById("searchInput").value = "";
      updateSearchClearButton();

      document.querySelectorAll(".group-btn").forEach(btn =>
        btn.classList.toggle("active", btn.dataset.group === group)
      );

      renderGallery();
    }

    document.querySelectorAll(".group-btn").forEach(button =>
      button.addEventListener("click", () => setGroup(button.dataset.group))
    );

    const worksSearchZone = document.getElementById("worksSearchZone");
    const searchToggleBtn = document.getElementById("searchToggleBtn");

    function openSearchPanel() {
      worksSearchZone.classList.add("expanded");
      searchToggleBtn.setAttribute("aria-expanded", "true");
      requestAnimationFrame(() => document.getElementById("searchInput").focus());
    }

    function closeSearchPanel() {
      if (currentKeyword.trim()) return;
      worksSearchZone.classList.remove("expanded");
      searchToggleBtn.setAttribute("aria-expanded", "false");
    }

    searchToggleBtn.addEventListener("click", openSearchPanel);

    document.getElementById("searchInput").addEventListener("input", function() {
      currentKeyword = this.value;
      visibleCount = INITIAL_VISIBLE_COUNT;
      updateSearchClearButton();
      renderGallery();
    });

    document.getElementById("clearSearchBtn").addEventListener("click", clearSearch);

    function clearSearch() {
      currentKeyword = "";
      visibleCount = INITIAL_VISIBLE_COUNT;
      document.getElementById("searchInput").value = "";
      updateSearchClearButton();
      renderGallery();
      openSearchPanel();
      document.getElementById("searchInput").focus();
    }

    function updateSearchClearButton() {
      document.getElementById("clearSearchBtn").classList.toggle("show", !!currentKeyword.trim());
    }

    const modalSearchZone = document.getElementById("modalSearchZone");
    const modalSearchToggle = document.getElementById("modalSearchToggle");
    const modalSearchInput = document.getElementById("modalSearchInput");
    const modalSearchSubmit = document.getElementById("modalSearchSubmit");
    const modalSearchResults = document.getElementById("modalSearchResults");

    modalSearchToggle.addEventListener("click", function() {
      modalSearchZone.classList.add("expanded");
      requestAnimationFrame(() => modalSearchInput.focus());
    });

    modalSearchInput.addEventListener("input", renderModalSearchResults);

    modalSearchSubmit.addEventListener("click", function() {
      renderModalSearchResults();
      modalSearchInput.focus();
    });

    function renderModalSearchResults() {
      const keyword = modalSearchInput.value.trim().toLowerCase();

      if (!keyword) {
        modalSearchResults.innerHTML = "";
        modalSearchResults.classList.remove("show");
        return;
      }

      const results = works
        .filter(work => work.group_key === currentGroup)
        .filter(work => {
          return [
            work.display_number,
            work.work_name,
            work.participant_name,
            work.shooting_theme
          ].join(" ").toLowerCase().includes(keyword);
        })
        .slice(0, 8);

      if (!results.length) {
        modalSearchResults.innerHTML = `<div class="modal-search-result">找不到符合的作品</div>`;
        modalSearchResults.classList.add("show");
        return;
      }

      modalSearchResults.innerHTML = results.map(work => `
        <div class="modal-search-result" onclick="switchModalWork('${escapeJs(work.work_id)}')">
          <strong>${escapeHtml(work.display_number)}</strong>　
          ${escapeHtml(work.work_name)}｜${escapeHtml(work.participant_name)}
        </div>
      `).join("");

      modalSearchResults.classList.add("show");
    }

    function switchModalWork(workId) {
      const work = works.find(item => item.work_id === workId);
      if (!work) return;

      currentModalSequence = getFilteredSortedWorks();
      currentModalIndex = currentModalSequence.findIndex(item => item.work_id === workId);

      renderModalByWork(work, "modal_search");

      modalSearchInput.value = "";
      modalSearchResults.innerHTML = "";
      modalSearchResults.classList.remove("show");
      modalSearchZone.classList.remove("expanded");
    }

    document.getElementById("modalClose").addEventListener("click", closeModal);
    document.getElementById("copyLinkBtn").addEventListener("click", copyCurrentWorkLink);

    document.getElementById("detailModal").addEventListener("click", function(event) {
      if (event.target === this) closeModal();
    });

    document.getElementById("modalVoteBtn").addEventListener("click", function() {
      if (currentWorkId) voteWork(currentWorkId);
    });

    document.getElementById("descriptionToggle").addEventListener("click", toggleDescription);

    document.addEventListener("keydown", function(event) {
      const modalIsOpen = document.getElementById("detailModal").classList.contains("show");

      if (modalIsOpen) {
        if (event.key === "Escape") closeModal();
        if (event.key === "ArrowLeft") showPreviousWork();
        if (event.key === "ArrowRight") showNextWork();
      } else {
        if (
          event.key === "Escape" &&
          worksSearchZone.classList.contains("expanded") &&
          !currentKeyword.trim()
        ) {
          closeSearchPanel();
        }
      }
    });

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeJs(value) {
      return String(value ?? "")
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'");
    }

    function cssEscape(value) {
      return (window.CSS && CSS.escape)
        ? CSS.escape(value)
        : String(value).replace(/["\\]/g, "\\$&");
    }

    loadWorks();
  </script>
</body>
</html>
